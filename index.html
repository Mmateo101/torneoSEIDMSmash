<meta name="description" content="Bracket interactivo del torneo de Super Smash Bros. Ultimate — Torneo E-Sports IDM, II Edición.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%232b2e33'/%3E%3Crect x='34' y='0' width='9' height='100' fill='%23fff'/%3E%3Crect x='0' y='60' width='100' height='9' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #262a78;
    --surface: #1e1b5a;
    --surface-2: #2b2673;
    --line: rgba(196, 186, 255, .22);
    --line-strong: #6d63c6;
    --text: #f6f4ff;
    --muted: #b9b2ea;
    --ink: #c81fa6;
    --ink-soft: #e4dfff;
    --neon: #ff5fe0;
    --neon-2: #a46bff;
    --pill: #c7e6ff;
    --pill-ink: #1d1d5c;
    --win: linear-gradient(100deg, #d4209f 0%, #8f3dff 100%);
    --radius: 10px;
    --shadow: 0 2px 4px rgba(8, 5, 35, .25), 0 8px 24px rgba(8, 5, 35, .3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(60% 50% at 90% 5%, rgba(255, 79, 216, .28), transparent 70%),
      radial-gradient(60% 55% at 0% 100%, rgba(255, 79, 216, .22), transparent 70%),
      radial-gradient(70% 60% at 30% 40%, rgba(80, 110, 255, .25), transparent 70%),
      linear-gradient(165deg, #22277a 0%, #352a8c 45%, #5b2a8e 100%) var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }

  /* ---------- Fondo pixel (Mario Bros) ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .sprite { position: absolute; }
  .bg .sprite { opacity: .55; }
  .sprite svg { display: block; shape-rendering: crispEdges; }
  .ground {
    position: fixed; left: 0; right: 0; bottom: 0; height: 32px; z-index: 0; pointer-events: none;
    background-repeat: repeat-x; background-size: 32px 32px; image-rendering: pixelated; opacity: .6;
  }
  .a-coin svg { animation: coin-spin .9s steps(4) infinite; transform-origin: center; }
  .a-hop { animation: hop 2.6s infinite; }
  .a-bump { animation: bump 3.2s steps(3) infinite; }
  .a-pop { animation: pop 3.2s infinite; opacity: 0; }
  .a-drift { animation: drift 16s steps(16) infinite alternate; }
  .a-walk { animation: walk 34s linear infinite; }
  .a-walk svg { animation: waddle .5s steps(2) infinite; }
  .a-twinkle { animation: twinkle 2.4s steps(3) infinite; }
  @keyframes coin-spin { 0% { transform: scaleX(1); } 25% { transform: scaleX(.55); } 50% { transform: scaleX(.15); } 75% { transform: scaleX(.55); } }
  @keyframes hop {
    0% { transform: translateY(0); animation-timing-function: cubic-bezier(.2, .7, .4, 1); }
    50% { transform: translateY(-70px) rotate(12deg); animation-timing-function: cubic-bezier(.6, 0, .8, .3); }
    100% { transform: translateY(0); }
  }
  @keyframes bump { 0%, 82%, 100% { transform: translateY(0); } 88% { transform: translateY(-10px); } 94% { transform: translateY(0); } }
  @keyframes pop { 0%, 84% { opacity: 0; transform: translateY(0); } 87% { opacity: 1; } 96% { opacity: 1; transform: translateY(-64px); } 100% { opacity: 0; transform: translateY(-64px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(64px); } }
  @keyframes walk { from { transform: translateX(-80px); } to { transform: translateX(calc(100vw + 80px)); } }
  @keyframes waddle { 0% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes twinkle { 0%, 100% { opacity: .9; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .sprite, .sprite svg { animation: none !important; } .a-pop { display: none; } }

  /* ---------- Layout ---------- */
  .app { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 16px 16px 72px; }
  header.hero {
    position: relative; overflow: hidden; border-radius: 22px; color: #fff;
    background:
      radial-gradient(70% 90% at 85% 0%, rgba(255, 79, 216, .45), transparent 70%),
      linear-gradient(160deg, #2c3196 0%, #46309a 50%, #7a2d93 100%);
    border: 1px solid rgba(255, 255, 255, .16);
    box-shadow: 0 0 0 1px rgba(255, 95, 224, .25), 0 0 40px rgba(255, 95, 224, .35), 0 14px 40px rgba(8, 5, 35, .45);
    padding: 28px 28px 22px;
  }
  header.hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  .hero-sprites { position: absolute; inset: 0; pointer-events: none; opacity: .35; }
  @media (max-width: 640px) { .hero-sprites { opacity: .2; } .bg .sprite { opacity: .4; } }
  .hero-inner { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
  .edition { font-family: Poppins, sans-serif; font-weight: 700; font-size: clamp(18px, 2.4vw, 26px); text-shadow: 0 0 8px rgba(255, 255, 255, .6), 0 0 18px var(--neon); }
  .edition sup { font-size: .6em; }
  h1 {
    font-family: Anton, Impact, sans-serif; font-weight: 400;
    font-size: clamp(46px, 8.5vw, 96px); line-height: .98; margin: 4px 0 14px; letter-spacing: .005em;
    color: #fff;
    text-shadow: 0 0 4px rgba(255, 255, 255, .8), 0 0 14px var(--neon), 0 0 34px rgba(255, 95, 224, .75), 0 0 70px rgba(164, 107, 255, .7);
  }
  h1 span { display: inline-block; margin-right: .18em; }
  .game-switch { display: flex; gap: 8px; flex-wrap: wrap; }
  .game-pill {
    border: 0; cursor: pointer; transition: background .15s, box-shadow .15s, color .15s;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--pill); color: var(--pill-ink); border-radius: 99px; padding: 7px 18px 7px 8px;
    font-family: Poppins, sans-serif; font-weight: 700; font-size: 15px;
    box-shadow: 0 0 18px rgba(127, 200, 255, .6);
  }
  .game-pill[aria-pressed="false"] { background: rgba(255, 255, 255, .1); color: #e8e4ff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
  .game-pill[aria-pressed="false"]:hover { background: rgba(255, 255, 255, .2); }
  .game-pill[aria-pressed="false"] svg { opacity: .75; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 14px; padding: 8px 14px; min-width: 96px; backdrop-filter: blur(4px);
  }
  .stat b { display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1.15; text-shadow: 0 0 6px rgba(255, 255, 255, .6), 0 0 16px var(--neon); }
  .stat span { font-size: 12px; color: #e2dcff; font-weight: 500; }
  .progress { position: relative; height: 8px; background: rgba(255, 255, 255, .1); border-radius: 0; overflow: hidden; margin: 20px 0 0; }
  .progress i { display: block; height: 100%; width: 0; transition: width .4s steps(8);
    background: repeating-linear-gradient(90deg, #ff7fe6 0 8px, #b07bff 8px 16px); box-shadow: 0 0 12px var(--neon); }

  nav.tabs { display: flex; gap: 6px; margin: 20px 0 16px; flex-wrap: wrap; align-items: center; }
  .tab {
    border: 1px solid var(--line); background: var(--surface); padding: 8px 18px; border-radius: 99px;
    cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink-soft);
  }
  .tab:hover { border-color: var(--line-strong); }
  .tab[aria-selected="true"] { background: var(--pill); border-color: var(--pill); color: var(--pill-ink); box-shadow: 0 0 16px rgba(127, 200, 255, .55); }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--line-strong); background: var(--surface); padding: 8px 14px; border-radius: 8px;
    cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.dark { background: var(--win); color: #fff; border-color: transparent; box-shadow: 0 0 14px rgba(255, 95, 224, .5); }
  .btn.dark:hover { filter: brightness(1.1); background: var(--win); }
  .icon-btn { padding: 8px 12px; }
  .icon-btn svg { display: block; }
  body.editing .icon-btn { background: var(--win); color: #fff; border-color: transparent; box-shadow: 0 0 14px rgba(255, 95, 224, .5); }
  .save-state { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .save-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  .save-state.ok::before { background: #5cf2a5; box-shadow: 0 0 8px #5cf2a5; }
  .save-state.busy::before { background: #ffd04a; }
  .save-state.err::before { background: #ff6b8a; }

  .toolbar {
    display: none; gap: 8px; flex-wrap: wrap; align-items: center;
    background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 16px;
  }
  body.editing .toolbar { display: flex; }
  .toolbar .hint { font-size: 13px; color: var(--muted); }
  .notice { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ink-soft); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; display: none; }
  .notice.show { display: block; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Bracket ---------- */
  .bracket-wrap { overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
  .bracket { position: relative; display: flex; gap: 44px; min-width: 1060px; padding: 4px 4px 8px; }
  .bracket svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .bracket svg.lines path { fill: none; stroke: var(--line-strong); stroke-width: 2; }
  .bracket svg.lines path.done { stroke: var(--neon); filter: drop-shadow(0 0 3px var(--neon)); }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 180px; }
  .col-head { text-align: center; margin-bottom: 10px; }
  .col-head b { text-shadow: 0 0 12px rgba(255, 95, 224, .7); display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 20px; letter-spacing: .03em; }
  .col-head span { font-size: 12px; color: var(--muted); }
  .col-body { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; min-height: 760px; }

  .match { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .match .num { position: absolute; left: -1px; top: -1px; font-size: 10px; font-weight: 700; background: var(--surface-2); color: var(--muted); padding: 1px 6px; border-bottom-right-radius: 6px; border: 1px solid var(--line); display: none; }
  .slot {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; min-height: 40px;
    background: none; border: 0; text-align: left; cursor: default;
  }
  .slot + .slot { border-top: 1px solid var(--line); }
  .slot .seed { font-size: 11px; font-weight: 700; color: var(--muted); width: 18px; text-align: right; flex: none; }
  .slot .who { flex: 1; min-width: 0; }
  .slot .tag { font-weight: 700; display: block; overflow-wrap: anywhere; line-height: 1.25; }
  .slot .sub { font-size: 11px; line-height: 1.3; color: var(--muted); display: block; overflow-wrap: anywhere; }
  .slot .score { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 18px; min-width: 22px; text-align: center; color: var(--muted); }
  .slot.empty .tag { color: var(--line-strong); font-weight: 500; font-style: italic; }
  .slot.win { background: var(--win); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
  .slot.win .sub, .slot.win .seed, .slot.win .score { color: #ffe1f7; }
  .slot.win .tag { text-shadow: 0 0 10px rgba(255, 255, 255, .6); }
  .slot.lose .tag { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .score-in { width: 40px; padding: 2px 4px; text-align: center; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); color: var(--text); font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 15px; }
  .slot.win .score-in { background: rgba(20, 10, 60, .35); color: #fff; border-color: rgba(255, 255, 255, .45); }

  .champ { background: var(--surface); border: 2px solid var(--neon); box-shadow: 0 0 22px rgba(255, 95, 224, .55), inset 0 0 18px rgba(255, 95, 224, .2); border-radius: 14px; padding: 18px 14px; text-align: center; box-shadow: var(--shadow); }
  .champ .label { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .champ .name { text-shadow: 0 0 6px rgba(255, 255, 255, .7), 0 0 18px var(--neon); font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 26px;  text-transform: uppercase; line-height: 1.1; margin-top: 6px; word-break: break-word; }
  .champ .name.tbd { color: var(--line-strong); }
  .champ .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---------- Mario Kart ---------- */
  .mk-plan { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .mk-config { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .mk-config label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .mk-config input { width: 110px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-2); color: var(--text); font-family: Anton, Impact, sans-serif; font-size: 18px; }
  .mk-config .plan { flex: 1; min-width: 240px; font-size: 13px; color: var(--ink-soft); }
  .mk-round { margin-bottom: 26px; }
  .mk-round-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .mk-round-head b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; text-shadow: 0 0 12px rgba(255, 95, 224, .7); }
  .mk-round-head span { font-size: 13px; color: var(--muted); }
  .mk-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .mk-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .mk-group-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 13px; }
  .mk-group-head b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }
  .chip.done { background: var(--win); color: #fff; border-color: transparent; }
  .chip.wait { color: var(--muted); background: transparent; border-style: dashed; }
  .chip.tie { background: #ffd04a; color: #3a2a00; border-color: transparent; }
  .mk-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); min-height: 44px; }
  .mk-row .pos { width: 16px; font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; flex: none; }
  .mk-row .who { flex: 1; min-width: 0; }
  .mk-row .tag { font-weight: 700; display: block; overflow-wrap: anywhere; line-height: 1.25; }
  .mk-row .sub { font-size: 11px; line-height: 1.3; color: var(--muted); display: block; overflow-wrap: anywhere; }
  .mk-row .pts { font-family: Anton, Impact, sans-serif; font-size: 20px; min-width: 34px; text-align: right; }
  .mk-row.q { background: var(--win); color: #fff; }
  .mk-row.q .sub, .mk-row.q .pos { color: #ffe1f7; }
  .mk-row.q .score-in { background: rgba(20, 10, 60, .35); color: #fff; border-color: rgba(255, 255, 255, .45); }
  .mk-row.out .tag { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .mk-row.tie { box-shadow: inset 3px 0 0 #ffd04a; }
  .mk-row.empty .tag { color: var(--line-strong); font-style: italic; font-weight: 500; }
  .mk-row .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; background: rgba(255, 255, 255, .22); }
  .mk-row .score-in { width: 52px; }
  .mk-row .tb-line { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; font-weight: 700; color: #ffd04a; }
  .mk-row.q .tb-line { color: #fff3c4; }
  .mk-row .tb-in { width: 44px; font-size: 13px; padding: 1px 4px; border-color: #ffd04a; }
  .tie-note { font-size: 12px; color: #ffd04a; padding: 8px 12px; border-top: 1px dashed rgba(255, 208, 74, .5); }
  .mk-final { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .mk-final .match { width: min(100%, 320px); }
  .mk-final .champ { width: min(100%, 240px); }

  /* ---------- Participantes ---------- */
  .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; }
  .pcard .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: Anton, Impact, sans-serif; font-weight: 400; color: var(--ink-soft); flex: none; }
  .pcard.out .avatar { opacity: .5; }
  .pcard.champion .avatar { background: var(--win); color: #fff; border-color: transparent; box-shadow: 0 0 14px var(--neon); }
  .pcard .info { min-width: 0; flex: 1; }
  .pcard .tag { font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .sub { font-size: 12px; color: var(--muted); display: block; overflow-wrap: anywhere; }
  .tag.no-tag { font-style: italic; font-weight: 600; opacity: .75; }
  .pcard .status { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; display: block; }
  .pcard input { width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 6px; font-size: 13px; background: var(--surface-2); margin-top: 3px; }
  .pcard input.tag-in { font-weight: 700; }

  footer { margin-top: 36px; font-size: 12px; color: var(--muted); text-align: center; }

  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 20px; max-width: 340px; width: calc(100% - 32px); box-shadow: 0 0 40px rgba(255, 95, 224, .35); background: var(--surface); color: var(--text); }
  dialog::backdrop { background: rgba(10, 6, 40, .6); }
  dialog h3 { margin: 0 0 6px; font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; }
  dialog p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  dialog input { width: 100%; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 8px; font-size: 16px; margin-bottom: 12px; background: var(--surface-2); }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  dialog .err { color: #ff8fa8; font-size: 13px; min-height: 18px; margin: -6px 0 8px; }

  @media (max-width: 640px) {
    header.top { padding-top: 20px; }
    .stat { min-width: 0; flex: 1; padding: 6px 10px; }
    .stat b { font-size: 18px; }
    .players-grid { grid-template-columns: 1fr 1fr; }
    .pcard { flex-direction: column; text-align: center; }
    .pcard .info { width: 100%; }
  }
</style>
</head>
<body>

<!-- Fondo pixel animado estilo Mario Bros (se genera en JS) -->
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="ground" id="ground" aria-hidden="true"></div>

<div class="app">
  <header class="hero">
    <div class="hero-sprites" id="hero-sprites" aria-hidden="true"></div>
    <div class="hero-inner">
      <div>
        <div class="edition">2<sup>a</sup> Edición</div>
        <h1><span>Torneo</span><span>E-Sports</span><span>IDM</span></h1>

  const DATA_VERSION = 3;
  const LOCAL_KEY = 'torneo-idm-smash:state';
  const PIN_KEY = 'torneo-idm-smash:pin';

  // Sorteo reproducible para el bracket inicial.
  function seededShuffle(arr, seed) {
    const a = arr.slice();
    let t = seed >>> 0;
    const rand = () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function defaultState() {
    return {
      players: DEFAULT_PLAYERS.map(p => ({ ...p })),
      order: seededShuffle(DEFAULT_PLAYERS.map(p => p.id), 2026),
      results: {},
      updatedAt: 0,
      dataVersion: DATA_VERSION,
    };
  }
  // Corrige nombres/GamerTags de estados guardados con la versión anterior de la lista,
  // conservando el orden del bracket y los resultados.
  function migrate(s) {
    if (s.dataVersion === DATA_VERSION) return s;
    DEFAULT_PLAYERS.forEach(d => {
      const p = s.players.find(x => x.id === d.id);
      if (p) { Object.assign(p, { tag: d.tag, name: d.name }); delete p.main; }
    });
    s.dataVersion = DATA_VERSION;
    return s;
  }

  // ---------- Estado ----------
  let state = defaultState();
  let remote = { configured: false, pinRequired: false, reachable: false };
  let editing = false;
  let pin = '';
  try { pin = localStorage.getItem(PIN_KEY) || ''; } catch {}

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const playerById = id => state.players.find(p => p.id === id);
  // Si no registró GamerTag se muestra su nombre tal como lo escribió.
  const label = p => p.tag || 'Sin GamerTag';
  const tagClass = p => (p && !p.tag ? 'tag no-tag' : 'tag');
  const shortName = p => p.tag || p.name; // para campeón y avisos
  const numRounds = () => Math.log2(state.order.length);

  function roundName(r) {
    const left = state.order.length >> r; // jugadores en esa ronda
    if (left === 2) return 'Gran Final';
    if (left === 4) return 'Semifinales';
    if (left === 8) return 'Cuartos de final';
    if (left === 16) return 'Octavos de final';
    return `Ronda de ${left}`;
  }
  function roundShort(r) {
    const left = state.order.length >> r;
    return { 2: 'Final', 4: 'Semis', 8: 'Cuartos', 16: 'Octavos' }[left] || `R${r + 1}`;
  }
  const matchId = (r, m) => `${r}-${m}`;
  function matchNumber(r, m) {
    let n = 0;
    for (let i = 0; i < r; i++) n += state.order.length >> (i + 1);
    return n + m + 1;
  }

  // Jugadores de un combate, derivados del orden inicial y los ganadores previos.
  function participants(r, m) {
    if (r === 0) return [state.order[2 * m] || null, state.order[2 * m + 1] || null];
    return [winnerOf(r - 1, 2 * m), winnerOf(r - 1, 2 * m + 1)];
  }
  function winnerOf(r, m) {
    const res = state.results[matchId(r, m)];
    if (!res || !res.w) return null;
    const ps = participants(r, m);
    return ps.includes(res.w) ? res.w : null;
  }
  // Elimina ganadores que ya no son válidos (p. ej. tras deshacer una ronda anterior).
  function prune() {
    for (let r = 0; r < numRounds(); r++) {
      const count = state.order.length >> (r + 1);
      for (let m = 0; m < count; m++) {
        const id = matchId(r, m), res = state.results[id];
        if (res && res.w && !participants(r, m).includes(res.w)) {
          delete state.results[id];
        }
      }
    }
  }
  function forEachMatch(fn) {
    for (let r = 0; r < numRounds(); r++) {
      const count = state.order.length >> (r + 1);
      for (let m = 0; m < count; m++) fn(r, m);
    }
  }
  function champion() { return winnerOf(numRounds() - 1, 0); }

  function setScore(r, m, idx, val) {
    const id = matchId(r, m);
    const res = state.results[id] || {};
    const s = Array.isArray(res.s) ? res.s.slice() : ['', ''];
    s[idx] = val === '' ? '' : Math.max(0, Math.min(99, parseInt(val, 10) || 0));
    res.s = s;
    // El ganador lo decide el marcador: quien tenga más puntos avanza.
    const ps = participants(r, m);
    if (s[0] !== '' && s[1] !== '' && s[0] !== s[1]) res.w = ps[s[0] > s[1] ? 0 : 1];
    else delete res.w;
    if (s[0] === '' && s[1] === '') delete res.s;
    if (!res.w && !res.s) delete state.results[id]; else state.results[id] = res;
    prune();
  }
  function scoreOf(r, m) {
    const res = state.results[matchId(r, m)];
    return res && Array.isArray(res.s) ? res.s : ['', ''];
  }

  // ======================================================================
  // ---------- Mario Kart: grupos por puntos + final 1 vs 1 ----------
  // ======================================================================
  const MK_PLAYERS = [
    { id: 'm1', tag: "Thomasitop", name: "Antonio Vences Rossell" },
    { id: 'm2', tag: "DrWaza", name: "Pedro Eduardo De Leon Jr" },
    { id: 'm3', tag: "alvarozepedaa", name: "Álvaro Santiago Zepeda López" },
    { id: 'm4', tag: "Pauxl_15", name: "Paúl Alexander Calderón Pilla" },
    { id: 'm5', tag: "", name: "diego anaya hernandez" },
    { id: 'm6', tag: "Arigame9000", name: "Ari José De León Durán" },
    { id: 'm7', tag: "Blackwidow9000", name: "Fernanda Michelle Garcia Arriaga" },
    { id: 'm8', tag: "J-Butcher", name: "Jaime Barraza" },
    { id: 'm9', tag: "AbbytoFAN", name: "Hiram Abisaí Miranda Pérez" },
    { id: 'm10', tag: "JavTendoG", name: "Javier Escalante Guerrero" },
  ];
  function mkDefault() {
    return {
      players: MK_PLAYERS.map(p => ({ ...p })),
      order: seededShuffle(MK_PLAYERS.map(p => p.id), 2027),
      config: { rounds: 1, groupMin: 5 },
      scores: {}, tb: {}, final: {},
      updatedAt: 0,
    };
  }
  function mkValid(s) {
    return s && Array.isArray(s.players) && Array.isArray(s.order) && s.config && typeof s.config === 'object'
      && s.scores && typeof s.scores === 'object';
  }
  function mkMigrate(s) { s.tb = s.tb || {}; s.final = s.final || {}; return s; }
  let mk = mkDefault();

  // Estructura de rondas. Todos los grupos de una ronda tienen el mismo tamaño (>= mínimo) y de
  // cada grupo pasa la misma cantidad, así todos tienen las mismas posibilidades. La última ronda
  // deja exactamente 2 jugadores para la final 1 vs 1.
  function mkStructure(n, R, g) {
    const out = []; let N = n; g = Math.max(2, g);
    for (let r = 0; r < R && N > 2; r++) {
      const last = r === R - 1;
      let G = 1;
      for (let c = Math.floor(N / g); c >= 1; c--) if (N % c === 0) { G = c; break; }
      let k;
      if (last) { G = (G >= 2 && N % 2 === 0 && N / 2 >= g) ? 2 : 1; k = 2 / G; }
      else {
        const size = N / G;
        const target = N * Math.pow(2 / N, 1 / (R - r));
        k = Math.max(1, Math.round(target / G));
        k = Math.min(k, size - 1);
        if (G * k < 2) k = 2;
        if (k >= size) { G = 1; k = 2; }
      }
      out.push({ N, G, size: N / G, k });
      N = G * k;
    }
    return out;
  }
  function mkMaxRounds(n, g) { let best = 1; for (let R = 1; R <= 8; R++) if (mkStructure(n, R, g).length === R) best = R; return best; }

  const num = v => (v === '' || v === undefined || v === null || isNaN(v)) ? null : Number(v);
  const GROUP_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function mkCompute() {
    const st = mkStructure(mk.order.length, mk.config.rounds, mk.config.groupMin);
    const rounds = [];
    let entrants = mk.order.slice(), known = true;
    st.forEach((sr, r) => {
      const groups = Array.from({ length: sr.G }, () => []);
      if (known) entrants.forEach((pid, i) => groups[i % sr.G].push(pid));
      const sc = pid => num(mk.scores[`${r}:${pid}`]);
      const tb = pid => num(mk.tb[`${r}:${pid}`]) ?? 0;
      const gres = groups.map(members => {
        const complete = known && members.length > 0 && members.every(pid => sc(pid) !== null);
        const ranked = complete ? members.slice().sort((a, b) => (sc(b) - sc(a)) || (tb(b) - tb(a))) : members.slice();
        let qualifiers = [], tie = [];
        if (complete) {
          const a = ranked[sr.k - 1], b = ranked[sr.k];
          if (b !== undefined && sc(a) === sc(b) && tb(a) === tb(b)) {
            tie = members.filter(pid => sc(pid) === sc(a) && tb(pid) === tb(a));
            // Los que quedaron arriba del empate sí pasan; el empate se resuelve con desempate.
            qualifiers = ranked.slice(0, Math.min(...tie.map(t => ranked.indexOf(t))));
          } else qualifiers = ranked.slice(0, sr.k);
        }
        return { members, ranked, complete, qualifiers, tie, done: complete && !tie.length };
      });
      const done = known && gres.every(gr => gr.done);
      rounds.push({ ...sr, index: r, groups: gres, known, done, sc, tb });
      if (done) { entrants = []; for (let q = 0; q < sr.k; q++) gres.forEach(gr => entrants.push(gr.qualifiers[q])); }
      else known = false;
    });
    const finalists = known ? entrants.slice(0, 2) : null;
    let s = ['', ''], winner = null;
    if (finalists && finalists.length === 2) {
      const f = mk.final;
      if (f && f.a === finalists[0] && f.b === finalists[1] && Array.isArray(f.s)) s = f.s;
      const a = num(s[0]), b = num(s[1]);
      if (a !== null && b !== null && a !== b) winner = a > b ? finalists[0] : finalists[1];
    }
    return { rounds, finalists: finalists && finalists.length === 2 ? finalists : null, finalScore: s, winner };
  }
  // Quita puntos de jugadores que ya no están en una ronda (p. ej. tras corregir una ronda anterior).
  function mkPrune() {
    const c = mkCompute();
    const keep = new Set();
    c.rounds.forEach(R => R.groups.forEach(gr => gr.members.forEach(pid => keep.add(`${R.index}:${pid}`))));
    Object.keys(mk.scores).forEach(k => { if (!keep.has(k)) delete mk.scores[k]; });
    Object.keys(mk.tb).forEach(k => { if (!keep.has(k)) delete mk.tb[k]; });
    if (!c.finalists || mk.final.a !== c.finalists[0] || mk.final.b !== c.finalists[1]) mk.final = {};
  }
  function setNum(obj, key, val, max) {
    if (val === '' || val === null) delete obj[key];
    else obj[key] = Math.max(0, Math.min(max, parseInt(val, 10) || 0));
  }
  function mkSetFinal(idx, val) {
    const c = mkCompute();
    if (!c.finalists) return;
    const f = (mk.final.a === c.finalists[0] && mk.final.b === c.finalists[1]) ? mk.final : { a: c.finalists[0], b: c.finalists[1], s: ['', ''] };
    f.s = Array.isArray(f.s) ? f.s.slice() : ['', ''];
    f.s[idx] = val === '' ? '' : Math.max(0, Math.min(999, parseInt(val, 10) || 0));
    mk.final = f;
  }
  function mkHasResults() { return Object.keys(mk.scores).length > 0 || Object.keys(mk.final).length > 0; }

  // ---------- Juego activo ----------
  const GAME_KEY = 'torneo-idm-smash:game';
  let game = 'smash';
  try { game = localStorage.getItem(GAME_KEY) || 'smash'; } catch {}
  if (location.hash === '#mariokart') game = 'mk';
  if (location.hash === '#smash') game = 'smash';
  if (game !== 'mk') game = 'smash';

  // ---------- Persistencia (un almacén por juego) ----------
  const stores = {
    smash: { local: LOCAL_KEY, api: '/api/state', get: () => state, set: s => { state = migrate(s); }, valid: validState, timer: null, saving: false, dirty: false },
    mk: { local: 'torneo-idm-smash:mariokart', api: '/api/state?game=mk', get: () => mk, set: s => { mk = mkMigrate(s); }, valid: mkValid, timer: null, saving: false, dirty: false },
  };
  function saveLocal(g = game) { try { localStorage.setItem(stores[g].local, JSON.stringify(stores[g].get())); } catch {} }
  function loadLocal(g) {
    try { const raw = localStorage.getItem(stores[g].local); return raw ? JSON.parse(raw) : null; } catch { return null; }
  }
  function validState(s) {
    return s && Array.isArray(s.players) && Array.isArray(s.order) && s.results && typeof s.results === 'object'
      && s.order.length >= 2 && (s.order.length & (s.order.length - 1)) === 0;
  }

  function setSaveState(text, cls) {
    const el = $('#save-state');
    el.textContent = text;
    el.className = 'save-state ' + (cls || '');
  }

  function commit(rerender = true, g = game) {
    const st = stores[g];
    st.get().updatedAt = Date.now();
    saveLocal(g);
    if (rerender) render(); else renderStats();
    if (remote.configured) {
      st.dirty = true;
      setSaveState('Guardando…', 'busy');
      clearTimeout(st.timer);
      st.timer = setTimeout(() => pushRemote(g), 450);
    }
  }

  async function pushRemote(g) {
    const st = stores[g];
    if (st.saving) { st.timer = setTimeout(() => pushRemote(g), 300); return; }
    st.saving = true; st.dirty = false;
    try {
      const r = await fetch(st.api, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-pin': pin },
        body: JSON.stringify({ state: st.get() }),
        keepalive: true, // permite terminar el guardado aunque se cierre la pestaña
      });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) { setSaveState('PIN inválido', 'err'); exitEdit(); askPin(); return; }
      if (!r.ok) throw new Error(data.error || r.status);
      if (!st.dirty) st.get().updatedAt = data.updatedAt;
      saveLocal(g);
      setSaveState('Guardado en línea', 'ok');
    } catch (e) {
      setSaveState('Error al guardar — reintentando', 'err');
      st.dirty = true;
      clearTimeout(st.timer);
      st.timer = setTimeout(() => pushRemote(g), 4000);
    } finally {
      st.saving = false;
    }
  }

  async function pullRemote(initial = false, g = game) {
    const st = stores[g];
    try {
      const r = await fetch(st.api, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      remote = { configured: !!data.configured, pinRequired: !!data.pinRequired, reachable: true };
      if (!remote.configured) {
        setSaveState('Solo en este navegador', '');
        showNotice('El almacenamiento en línea aún no está configurado: los cambios se guardan solo en este navegador. Conecta Upstash Redis en Vercel para que se compartan (ver README).');
        return;
      }
      showNotice('');
      if (st.dirty || st.saving) return;
      if (data.state && st.valid(data.state)) {
        if ((data.state.updatedAt || 0) !== (st.get().updatedAt || 0)) {
          st.set(data.state);
          saveLocal(g);
          if (g === game) render();
        }
      }
      if (g === game || initial) setSaveState('Sincronizado', 'ok');
    } catch {
      remote.reachable = false;
      setSaveState(initial ? 'Modo local' : 'Sin conexión', initial ? '' : 'err');
    }
  }

  function showNotice(text) {
    const el = $('#notice');
    el.textContent = text;
    el.classList.toggle('show', !!text);
  }

  // ---------- Edición ----------
  const PENCIL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  const CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg> Listo';
  function setEditButton() {
    const b = $('#edit-toggle');
    b.innerHTML = editing ? CHECK : PENCIL;
    b.title = editing ? 'Terminar de editar' : 'Editar resultados';
    b.setAttribute('aria-label', b.title);
  }
  function enterEdit() { editing = true; document.body.classList.add('editing'); setEditButton(); render(); }
  function exitEdit() { editing = false; document.body.classList.remove('editing'); setEditButton(); render(); }
  setEditButton();

  async function checkPin(candidate) {
    const r = await fetch('/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pin': candidate }, body: JSON.stringify({ check: true }) });
    return r.ok;
  }
  function askPin() {
    const dlg = $('#pin-dialog');
    $('#pin-input').value = '';
    $('#pin-err').textContent = '';
    dlg.showModal();
    setTimeout(() => $('#pin-input').focus(), 30);
  }
  $('#pin-form').addEventListener('submit', async e => {
    e.preventDefault();
    const candidate = $('#pin-input').value.trim();
    if (!candidate) return;
    try {
      if (await checkPin(candidate)) {
        pin = candidate;
        try { localStorage.setItem(PIN_KEY, pin); } catch {}
        $('#pin-dialog').close();
        enterEdit();
      } else {
        $('#pin-err').textContent = 'PIN incorrecto';
      }
    } catch { $('#pin-err').textContent = 'No se pudo verificar el PIN'; }
  });
  $('#pin-cancel').addEventListener('click', () => $('#pin-dialog').close());

  $('#edit-toggle').addEventListener('click', async () => {
    if (editing) return exitEdit();
    if (remote.configured && remote.pinRequired) {
      if (pin && await checkPin(pin).catch(() => false)) return enterEdit();
      return askPin();
    }
    enterEdit();
  });
  $('#btn-reset').addEventListener('click', () => {
    if (game === 'smash') {
      if (!confirm('¿Borrar todos los marcadores y resultados de Smash? Los enfrentamientos se mantienen.')) return;
      state.results = {};
    } else {
      if (!confirm('¿Borrar todos los puntos y la final de Mario Kart? Los grupos se mantienen.')) return;
      mk.scores = {}; mk.tb = {}; mk.final = {};
    }
    commit();
  });

  // ---------- Selector de juego y tabs ----------
  function setGame(g) {
    if (g === game) return;
    flushScores();
    game = g;
    try { localStorage.setItem(GAME_KEY, g); } catch {}
    history.replaceState(null, '', g === 'mk' ? '#mariokart' : '#smash');
    render();
    pullRemote(false, g);
  }
  document.querySelectorAll('.game-pill').forEach(b => b.addEventListener('click', () => setGame(b.dataset.game)));

  document.querySelectorAll('nav.tabs .tab').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs .tab').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + btn.dataset.view));
    if (btn.dataset.view === 'bracket') requestAnimationFrame(drawLines);
  }));

  // ---------- Render ----------
  function seedOf(pid) { return state.order.indexOf(pid) + 1; }

  function slotHTML(r, m, idx, pid, winner, score) {
    const p = pid && playerById(pid);
    const ready = participants(r, m).every(Boolean);
    let cls = 'slot';
    if (!p) cls += ' empty';
    else if (winner) cls += winner === pid ? ' win' : ' lose';
    const scoreHTML = editing && ready
      ? `<input class="score-in" type="number" min="0" max="99" inputmode="numeric" value="${esc(score[idx])}" data-in="score|${r},${m},${idx}" aria-label="Marcador ${esc(p ? shortName(p) : '')}">`
      : `<span class="score">${esc(score[idx])}</span>`;
    return `<div class="${cls}">
      <span class="seed">${p ? seedOf(pid) : ''}</span>
      <span class="who"><span class="${tagClass(p)}">${p ? esc(label(p)) : 'Por definir'}</span>${p ? `<span class="sub">${esc(p.name)}</span>` : ''}</span>
      ${scoreHTML}
    </div>`;
  }

  const TROPHY = fill => `<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v3h3v2a5 5 0 0 1-5 5h-.3A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 9.3 13H9a5 5 0 0 1-5-5V6h3V3zm10 5v3a3 3 0 0 0 1-2.2V8h-1zM6 8v.8A3 3 0 0 0 7 11V8H6z" fill="${fill}"/></svg>`;
  function champHTML(cp) {
    return `<div class="champ" data-match="champ">
        ${TROPHY(cp ? '#ffd84a' : 'var(--line-strong)')}
        <div class="label">Campeón</div>
        <div class="name ${cp ? '' : 'tbd'}">${cp ? esc(shortName(cp)) : '???'}</div>
        ${cp ? `<div class="sub">${cp.tag ? esc(cp.name) : ''}</div>` : '<div class="sub">Por definir</div>'}
      </div>`;
  }

  function renderBracket() {
    const R = numRounds();
    let html = '<svg class="lines" id="lines"></svg>';
    for (let r = 0; r < R; r++) {
      const count = state.order.length >> (r + 1);
      html += `<div class="col"><div class="col-head"><b>${roundName(r)}</b><span>${count} combate${count > 1 ? 's' : ''}</span></div><div class="col-body">`;
      for (let m = 0; m < count; m++) {
        const ps = participants(r, m), w = winnerOf(r, m), sc = scoreOf(r, m);
        html += `<div class="match" data-match="${r}-${m}" title="Combate ${matchNumber(r, m)}">
          ${slotHTML(r, m, 0, ps[0], w, sc)}${slotHTML(r, m, 1, ps[1], w, sc)}
        </div>`;
      }
      html += '</div></div>';
    }
    const ch = champion(), cp = ch && playerById(ch);
    html += `<div class="col"><div class="col-head"><b>Campeón</b><span>&nbsp;</span></div><div class="col-body">
      ${champHTML(cp)}</div></div>`;
    $('#bracket').innerHTML = html;
    requestAnimationFrame(drawLines);
  }

  function drawLines() {
    const host = $('#bracket'), svg = $('#lines');
    if (!host || !svg || !host.offsetParent) return;
    const base = host.getBoundingClientRect();
    const rect = el => { const b = el.getBoundingClientRect(); return { l: b.left - base.left, r: b.right - base.left, cy: b.top - base.top + b.height / 2 }; };
    const R = numRounds();
    let d = '';
    for (let r = 1; r <= R; r++) {
      const count = r < R ? state.order.length >> (r + 1) : 1;
      for (let m = 0; m < count; m++) {
        const target = r < R ? host.querySelector(`[data-match="${r}-${m}"]`) : host.querySelector('[data-match="champ"]');
        const feeders = r < R ? [2 * m, 2 * m + 1] : [0];
        if (!target) continue;
        const t = rect(target);
        feeders.forEach(fm => {
          const src = host.querySelector(`[data-match="${r - 1}-${fm}"]`);
          if (!src) return;
          const s = rect(src);
          const mid = s.r + (t.l - s.r) / 2;
          const done = !!winnerOf(r - 1, fm);
          d += `<path class="${done ? 'done' : ''}" d="M${s.r} ${s.cy} H${mid} V${t.cy} H${t.l}"/>`;
        });
      }
    }
    svg.innerHTML = d;
  }

  function currentRound() {
    for (let r = 0; r < numRounds(); r++) {
      const count = state.order.length >> (r + 1);
      for (let m = 0; m < count; m++) if (!winnerOf(r, m)) return r;
    }
    return null;
  }

  function playerStatus(pid) {
    if (champion() === pid) return { cls: 'champion', text: '🏆 Campeón' };
    let lastRound = -1, eliminated = null;
    forEachMatch((r, m) => {
      const ps = participants(r, m);
      if (!ps.includes(pid)) return;
      lastRound = r;
      const w = winnerOf(r, m);
      if (w && w !== pid) eliminated = r;
    });
    if (eliminated !== null) return { cls: 'out', text: `Eliminado en ${roundName(eliminated).toLowerCase()}` };
    if (lastRound >= 0) return { cls: '', text: `En ${roundName(lastRound).toLowerCase()}` };
    return { cls: '', text: '' };
  }

  // ---------- Render Mario Kart ----------
  const mkPlayer = id => mk.players.find(p => p.id === id);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  function mkPlanText(c) {
    const parts = c.rounds.map(R => `Ronda ${R.index + 1}: ${plural(R.G, 'grupo', 'grupos')} de ${R.size}, pasa${R.k > 1 ? 'n' : ''} ${R.k} por grupo`);
    parts.push('Final 1 vs 1');
    return parts.join(' → ');
  }

  function mkRowHTML(R, gr, pid, pos) {
    const p = mkPlayer(pid);
    const key = `${R.index}:${pid}`;
    const pts = R.sc(pid), inTie = gr.tie.includes(pid);
    let cls = 'mk-row';
    if (gr.qualifiers.includes(pid)) cls += ' q';
    else if (inTie) cls += ' tie';
    else if (gr.complete) cls += ' out';
    const ptsHTML = editing
      ? `<input class="score-in" type="number" min="0" max="999" inputmode="numeric" value="${esc(mk.scores[key] ?? '')}" data-in="mk|${key}" aria-label="Puntos de ${esc(shortName(p))}">`
      : `<span class="pts">${pts === null ? '—' : pts}</span>`;
    const tbVal = mk.tb[key];
    const tbHTML = inTie || tbVal !== undefined
      ? (editing
        ? `<span class="tb-line">Desempate <input class="score-in tb-in" type="number" min="0" max="99" inputmode="numeric" value="${esc(tbVal ?? '')}" data-in="mktb|${key}" aria-label="Desempate de ${esc(shortName(p))}"></span>`
        : (tbVal !== undefined ? `<span class="tb-line">Desempate: ${esc(tbVal)}</span>` : ''))
      : '';
    return `<div class="${cls}">
      <span class="pos">${gr.complete ? pos + 1 : ''}</span>
      <span class="who"><span class="${tagClass(p)}">${esc(label(p))}</span><span class="sub">${esc(p.name)}</span>${tbHTML}</span>
      ${gr.qualifiers.includes(pid) ? '<span class="badge">Pasa</span>' : ''}
      ${ptsHTML}
    </div>`;
  }

  function mkGroupHTML(R, gr, gi) {
    let status = 'Por jugar', scls = '';
    if (!R.known) { status = 'En espera'; scls = 'wait'; }
    else if (gr.tie.length) { status = 'Empate'; scls = 'tie'; }
    else if (gr.done) { status = 'Terminado'; scls = 'done'; }
    let rows;
    if (!R.known) {
      rows = Array.from({ length: R.size }, () => '<div class="mk-row empty"><span class="pos"></span><span class="who"><span class="tag">Por definir</span></span></div>').join('');
    } else {
      rows = gr.ranked.map((pid, i) => mkRowHTML(R, gr, pid, i)).join('');
    }
    const tieNote = gr.tie.length
      ? `<div class="tie-note">Empate por el último lugar para pasar. Jueguen una carrera de desempate y anoten sus puntos en “Desemp.”.</div>` : '';
    return `<div class="mk-group">
      <div class="mk-group-head"><b>Grupo ${GROUP_LETTERS[gi] || gi + 1}</b><span class="chip ${scls}">${status}</span></div>
      ${rows}${tieNote}
    </div>`;
  }

  function renderMK() {
    const c = mkCompute(), n = mk.order.length;
    let html = '';
    if (editing) {
      const maxR = mkMaxRounds(n, mk.config.groupMin);
      html += `<div class="mk-config">
        <label>Rondas eliminatorias<input type="number" min="1" max="${maxR}" value="${mk.config.rounds}" data-mkcfg="rounds"></label>
        <label>Mínimo de personas por grupo<input type="number" min="2" max="${n}" value="${mk.config.groupMin}" data-mkcfg="groupMin"></label>
        <div class="plan"><b>${esc(mkPlanText(c))}</b><br>Con este mínimo caben hasta ${plural(maxR, 'ronda', 'rondas')}. Todos los grupos de una ronda son del mismo tamaño y de cada uno pasan los mismos. Escribe los puntos que hizo cada jugador; los de más puntos pasan solos.</div>
      </div>`;
    } else {
      html += `<p class="mk-plan">${esc(mkPlanText(c))}</p>`;
    }
    c.rounds.forEach(R => {
      html += `<section class="mk-round">
        <div class="mk-round-head"><b>Ronda ${R.index + 1}</b><span>${plural(R.G, 'grupo', 'grupos')} de ${R.size} · pasa${R.k > 1 ? 'n' : ''} ${R.k} por grupo</span></div>
        <div class="mk-groups">${R.groups.map((gr, gi) => mkGroupHTML(R, gr, gi)).join('')}</div>
      </section>`;
    });
    // Final 1 vs 1
    const fs = c.finalScore, win = c.winner;
    const fslot = idx => {
      const pid = c.finalists && c.finalists[idx], p = pid && mkPlayer(pid);
      let cls = 'slot';
      if (!p) cls += ' empty'; else if (win) cls += win === pid ? ' win' : ' lose';
      const scoreHTML = editing && c.finalists
        ? `<input class="score-in" type="number" min="0" max="999" inputmode="numeric" value="${esc(fs[idx])}" data-in="mkfinal|${idx}" aria-label="Marcador final ${esc(p ? shortName(p) : '')}">`
        : `<span class="score">${esc(fs[idx])}</span>`;
      return `<div class="${cls}"><span class="seed"></span>
        <span class="who"><span class="${tagClass(p)}">${p ? esc(label(p)) : 'Por definir'}</span>${p ? `<span class="sub">${esc(p.name)}</span>` : ''}</span>
        ${scoreHTML}</div>`;
    };
    html += `<section class="mk-round">
      <div class="mk-round-head"><b>Final</b><span>1 vs 1 · el que haga más puntos es el campeón</span></div>
      <div class="mk-final"><div class="match">${fslot(0)}${fslot(1)}</div>${champHTML(win && mkPlayer(win))}</div>
    </section>`;
    $('#mk-view').innerHTML = html;
  }

  function mkStatus(pid, c) {
    if (c.winner === pid) return { cls: 'champion', text: '🏆 Campeón' };
    if (c.finalists && c.finalists.includes(pid)) return { cls: '', text: c.winner ? 'Subcampeón' : 'Finalista' };
    let text = '', cls = '';
    c.rounds.forEach(R => R.groups.forEach((gr, gi) => {
      if (!gr.members.includes(pid)) return;
      const where = `ronda ${R.index + 1} · grupo ${GROUP_LETTERS[gi]}`;
      if (gr.done && !gr.qualifiers.includes(pid)) { text = `Eliminado en ${where}`; cls = 'out'; }
      else if (!gr.done) text = `En ${where}`;
    }));
    return { cls, text };
  }

  function renderPlayers() {
    const isMk = game === 'mk';
    const c = isMk ? mkCompute() : null;
    const order = isMk ? mk.order : state.order;
    const find = isMk ? mkPlayer : playerById;
    $('#players-grid').innerHTML = order.map(find).filter(Boolean).map(p => {
      const st = isMk ? mkStatus(p.id, c) : playerStatus(p.id);
      const initials = esc((shortName(p) || '?').replace(/[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ]/g, '').slice(0, 2).toUpperCase() || '?');
      return `<div class="pcard ${st.cls}">
        <div class="avatar">${initials}</div>
        <div class="info">
          ${editing
            ? `<input class="tag-in" data-edit="${p.id}" data-field="tag" value="${esc(p.tag)}" placeholder="Sin GamerTag" aria-label="GamerTag"><span class="sub">${esc(p.name)}</span>`
            : `<span class="${tagClass(p)}">${esc(label(p))}</span><span class="sub">${esc(p.name)}</span>`}
          <span class="status">#${order.indexOf(p.id) + 1}${st.text ? ' · ' + esc(st.text) : ''}</span>
        </div>
      </div>`;
    }).join('');
  }

  function renderStats() {
    let total = 0, played = 0, roundText;
    if (game === 'smash') {
      forEachMatch((r, m) => { total++; if (winnerOf(r, m)) played++; });
      $('#st-players').textContent = state.players.length;
      const cur = currentRound();
      roundText = cur === null ? 'Terminado' : roundShort(cur);
      $('#st-played-label').textContent = 'Combates';
    } else {
      const c = mkCompute();
      c.rounds.forEach(R => R.groups.forEach(gr => { total++; if (gr.done) played++; }));
      total++; if (c.winner) played++;
      $('#st-players').textContent = mk.players.length;
      const cur = c.rounds.find(R => !R.done);
      roundText = cur ? `Ronda ${cur.index + 1}` : (c.winner ? 'Terminado' : 'Final');
      $('#st-played-label').textContent = 'Grupos y final';
    }
    $('#st-played').textContent = `${played}/${total}`;
    $('#st-round').textContent = roundText;
    $('#progress').style.width = (total ? (played / total) * 100 : 0) + '%';
  }

  function render() {
    const isMk = game === 'mk';
    document.querySelectorAll('.game-pill').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.game === game)));
    $('#tab-main').textContent = isMk ? 'Grupos y final' : 'Bracket';
    $('#bracket-wrap').hidden = isMk;
    $('#mk-view').hidden = !isMk;
    $('#toolbar-hint').innerHTML = isMk
      ? 'Arriba eliges cuántas rondas y el mínimo de personas por grupo. Escribe los puntos de cada jugador: <b>los que hagan más puntos pasan solos a la siguiente ronda</b>, y la final es 1 vs 1.'
      : 'Escribe los puntos de cada jugador. <b>El que tenga más puntos pasa automáticamente a la siguiente ronda.</b> Si borras o cambias un marcador, el bracket se corrige solo.';
    $('#footer-text').textContent = isMk
      ? `Mario Kart · ${mk.players.length} jugadores · Los resultados se actualizan automáticamente.`
      : 'Smash · Eliminación directa · 16 jugadores · Los resultados se actualizan automáticamente.';
    renderStats();
    if (isMk) renderMK(); else renderBracket();
    renderPlayers();
  }

  // ---------- Interacción ----------
  // Los puntos se juntan y se aplican de una vez: al salir de la casilla (Tab, Enter, tocar
  // fuera) o tras una pausa al escribir. Después se devuelve el cursor a donde esté la persona.
  const pending = new Map();
  let scoreTimer;
  function queueInput(el, delay) {
    pending.set(el.dataset.in, el.value);
    clearTimeout(scoreTimer);
    scoreTimer = setTimeout(flushScores, delay);
  }
  function flushScores() {
    clearTimeout(scoreTimer);
    if (!pending.size) return;
    const active = document.activeElement;
    const activeKey = active && active.dataset ? active.dataset.in : null;
    const caret = activeKey ? active.value.length : 0;
    let touched = null;
    pending.forEach((val, id) => {
      const [kind, key] = id.split('|');
      if (kind === 'score') { const [r, m, idx] = key.split(',').map(Number); setScore(r, m, idx, val); touched = 'smash'; }
      else if (kind === 'mk') { setNum(mk.scores, key, val, 999); touched = 'mk'; }
      else if (kind === 'mktb') { setNum(mk.tb, key, val, 99); touched = 'mk'; }
      else if (kind === 'mkfinal') { mkSetFinal(Number(key), val); touched = 'mk'; }
    });
    pending.clear();
    if (touched === 'mk') mkPrune();
    if (touched) commit(true, touched);
    const again = activeKey && document.querySelector(`[data-in="${activeKey}"]`);
    if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch {} }
  }
  document.addEventListener('input', e => {
    if (e.target.dataset && e.target.dataset.in) queueInput(e.target, 900);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.in) {
      queueInput(el, 0);
    } else if (el.dataset.mkcfg) {
      const field = el.dataset.mkcfg, n = mk.order.length;
      let v = parseInt(el.value, 10);
      if (isNaN(v)) { render(); return; }
      if (field === 'groupMin') v = Math.max(2, Math.min(n, v));
      if (field === 'rounds') v = Math.max(1, Math.min(mkMaxRounds(n, mk.config.groupMin), v));
      if (v === mk.config[field]) { render(); return; }
      if (mkHasResults() && !confirm('Cambiar el formato borra los puntos que ya se capturaron en Mario Kart. ¿Continuar?')) { render(); return; }
      mk.config[field] = v;
      mk.config.rounds = Math.max(1, Math.min(mkMaxRounds(n, mk.config.groupMin), mk.config.rounds));
      mk.scores = {}; mk.tb = {}; mk.final = {};
      commit(true, 'mk');
    } else if (el.dataset.edit) {
      const p = (game === 'mk' ? mkPlayer : playerById)(el.dataset.edit);
      if (!p) return;
      p[el.dataset.field] = el.value.trim();
      commit();
    }
  });

  let resizeRaf;
  window.addEventListener('resize', () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(drawLines); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLines);

  // ---------- Arranque ----------
  const localSmash = loadLocal('smash');
  if (validState(localSmash)) state = migrate(localSmash);
  const localMk = loadLocal('mk');
  if (mkValid(localMk)) mk = mkMigrate(localMk);
  render();
  pullRemote(true, 'smash').then(() => pullRemote(true, 'mk'));
  setInterval(() => { if (document.visibilityState === 'visible') pullRemote(); }, 8000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') pullRemote();
    else flushSave();
  });
  window.addEventListener('pagehide', flushSave);
  // Si hay un cambio pendiente de guardar, lo envía de inmediato (al cerrar o cambiar de pestaña).
  function flushSave() {
    flushScores();
    if (!remote.configured) return;
    Object.keys(stores).forEach(g => {
      const st = stores[g];
      if (!st.dirty || st.saving) return;
      clearTimeout(st.timer);
      pushRemote(g);
    });
  }
})();
</script>
</body>
</html>
