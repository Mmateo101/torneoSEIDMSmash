<!doctype html>
<html lang="es">
<head>

<title>Smash IDM · Bracket</title>
<meta name="description" content="Bracket interactivo del torneo de Super Smash Bros. Ultimate — Torneo E-Sports IDM, II Edición.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%232b2e33'/%3E%3Crect x='34' y='0' width='9' height='100' fill='%23fff'/%3E%3Crect x='0' y='60' width='100' height='9' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #262a78;
    --surface: #1e1b5a;
    --surface-2: #2b2673;
    --line: rgba(196, 186, 255, .22);
    --line-strong: #6d63c6;
    --text: #f6f4ff;
    --muted: #b9b2ea;
    --ink: #c81fa6;
    --ink-soft: #e4dfff;
    --neon: #ff5fe0;
    --neon-2: #a46bff;
    --pill: #c7e6ff;
    --pill-ink: #1d1d5c;
    --win: linear-gradient(100deg, #d4209f 0%, #8f3dff 100%);
    --glow: 255, 95, 224;          /* color del brillo (r, g, b) */
    --glow-2: 164, 107, 255;
    --pill-glow: 127, 200, 255;
    --win-sub: #ffe1f7;
    --prog-a: #ff7fe6;
    --prog-b: #b07bff;
    --page-bg:
      radial-gradient(60% 50% at 90% 5%, rgba(255, 79, 216, .28), transparent 70%),
      radial-gradient(60% 55% at 0% 100%, rgba(255, 79, 216, .22), transparent 70%),
      radial-gradient(70% 60% at 30% 40%, rgba(80, 110, 255, .25), transparent 70%),
      linear-gradient(165deg, #22277a 0%, #352a8c 45%, #5b2a8e 100%);
    --hero-bg:
      radial-gradient(70% 90% at 85% 0%, rgba(255, 79, 216, .45), transparent 70%),
      linear-gradient(160deg, #2c3196 0%, #46309a 50%, #7a2d93 100%);
    --radius: 10px;
    --shadow: 0 2px 4px rgba(8, 5, 35, .25), 0 8px 24px rgba(8, 5, 35, .3);
  }
  /* ---------- Tema Mario Kart (azul) ---------- */
  body.game-mk {
    --bg: #0a2a72;
    --surface: #0c2462;
    --surface-2: #133584;
    --line: rgba(160, 205, 255, .24);
    --line-strong: #4c86dd;
    --text: #f2f8ff;
    --muted: #a8c6f2;
    --ink: #1c66f2;
    --ink-soft: #dcecff;
    --neon: #3fd4ff;
    --neon-2: #2f7bff;
    --pill: #d4f1ff;
    --pill-ink: #0b2a6b;
    --win: linear-gradient(100deg, #1b5cff 0%, #12b6ff 100%);
    --glow: 63, 212, 255;
    --glow-2: 47, 123, 255;
    --pill-glow: 120, 220, 255;
    --win-sub: #d9f3ff;
    --prog-a: #7fe3ff;
    --prog-b: #2f7bff;
    --page-bg:
      radial-gradient(60% 50% at 90% 5%, rgba(63, 212, 255, .28), transparent 70%),
      radial-gradient(60% 55% at 0% 100%, rgba(47, 123, 255, .3), transparent 70%),
      radial-gradient(70% 60% at 30% 40%, rgba(30, 200, 255, .16), transparent 70%),
      linear-gradient(165deg, #0a1f63 0%, #0b3a9c 50%, #0a6fc4 100%);
    --hero-bg:
      radial-gradient(70% 90% at 85% 0%, rgba(63, 212, 255, .45), transparent 70%),
      linear-gradient(160deg, #0d2f8f 0%, #0f4fc0 55%, #0b86d6 100%);
    --shadow: 0 2px 4px rgba(2, 10, 40, .3), 0 8px 24px rgba(2, 10, 40, .35);
  }
  .app.swap { animation: swap-in .35s ease-out; }
  @keyframes swap-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .app.swap { animation: none; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page-bg), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }

  /* ---------- Fondo pixel (Mario Bros) ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .sprite { position: absolute; }
  .bg .sprite { opacity: .55; }
  .set { position: absolute; inset: 0; }
  body.game-mk .set-smash, body.game-mk .ground { display: none; }
  body:not(.game-mk) .set-mk, body:not(.game-mk) .road { display: none; }
  .road {
    position: fixed; left: 0; right: 0; bottom: 0; height: 40px; z-index: 0; pointer-events: none;
    background:
      repeating-linear-gradient(90deg, #eef3fb 0 16px, #e2383f 16px 32px) 0 0 / 100% 6px no-repeat,
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .85) 0 24px, transparent 24px 56px) 0 22px / 100% 3px no-repeat,
      #1f2a48;
    animation: road-move .5s linear infinite;
  }
  @keyframes road-move { from { background-position: 0 0, 0 22px; } to { background-position: -32px 0, -56px 22px; } }
  .speedlines {
    position: absolute; inset: 0; opacity: .5;
    background: repeating-linear-gradient(180deg, transparent 0 46px, rgba(160, 220, 255, .08) 46px 48px, transparent 48px 140px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
  }
  .a-drive { animation: drive 11s linear infinite; z-index: 1; }
  .a-drive svg, .a-idle svg { animation: rumble .18s steps(2) infinite; }
  .a-drive-rev { animation: drive-rev 16s linear infinite; }
  .a-drive-rev svg { transform: scaleX(-1); }
  .a-itembox { animation: itembox 2.4s steps(6) infinite; }
  .a-banana { animation: banana 3s steps(8) infinite; }
  .a-wave svg { animation: wave .8s steps(2) infinite; transform-origin: left center; }
  .a-lights svg rect[fill="#ff3b3b"] { animation: light-r 3s steps(1) infinite; }
  .a-lights svg rect[fill="#ffd23b"] { animation: light-y 3s steps(1) infinite; }
  .a-lights svg rect[fill="#3fd660"] { animation: light-g 3s steps(1) infinite; }
  @keyframes drive { from { transform: translateX(-140px); } to { transform: translateX(calc(100vw + 140px)); } }
  @keyframes drive-rev { from { transform: translateX(calc(100vw + 140px)); } to { transform: translateX(-140px); } }
  @keyframes rumble { 0% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
  .a-drive-rev svg { animation: none; }
  @keyframes itembox { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-12px) rotate(8deg); } }
  @keyframes banana { to { transform: rotate(360deg); } }
  @keyframes wave { 0% { transform: skewY(0); } 50% { transform: skewY(-6deg); } }
  @keyframes light-r { 0%, 33% { opacity: 1; } 34%, 100% { opacity: .25; } }
  @keyframes light-y { 0%, 33% { opacity: .25; } 34%, 66% { opacity: 1; } 67%, 100% { opacity: .25; } }
  @keyframes light-g { 0%, 66% { opacity: .25; } 67%, 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .road, .a-lights svg rect { animation: none !important; } }
  .sprite svg { display: block; shape-rendering: crispEdges; }
  .ground {
    position: fixed; left: 0; right: 0; bottom: 0; height: 32px; z-index: 0; pointer-events: none;
    background-repeat: repeat-x; background-size: 32px 32px; image-rendering: pixelated; opacity: .6;
  }
  .a-coin svg { animation: coin-spin .9s steps(4) infinite; transform-origin: center; }
  .a-hop { animation: hop 2.6s infinite; }
  .a-bump { animation: bump 3.2s steps(3) infinite; }
  .a-pop { animation: pop 3.2s infinite; opacity: 0; }
  .a-drift { animation: drift 16s steps(16) infinite alternate; }
  .a-walk { animation: walk 34s linear infinite; }
  .a-walk svg { animation: waddle .5s steps(2) infinite; }
  .a-twinkle { animation: twinkle 2.4s steps(3) infinite; }
  @keyframes coin-spin { 0% { transform: scaleX(1); } 25% { transform: scaleX(.55); } 50% { transform: scaleX(.15); } 75% { transform: scaleX(.55); } }
  @keyframes hop {
    0% { transform: translateY(0); animation-timing-function: cubic-bezier(.2, .7, .4, 1); }
    50% { transform: translateY(-70px) rotate(12deg); animation-timing-function: cubic-bezier(.6, 0, .8, .3); }
    100% { transform: translateY(0); }
  }
  @keyframes bump { 0%, 82%, 100% { transform: translateY(0); } 88% { transform: translateY(-10px); } 94% { transform: translateY(0); } }
  @keyframes pop { 0%, 84% { opacity: 0; transform: translateY(0); } 87% { opacity: 1; } 96% { opacity: 1; transform: translateY(-64px); } 100% { opacity: 0; transform: translateY(-64px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(64px); } }
  @keyframes walk { from { transform: translateX(-80px); } to { transform: translateX(calc(100vw + 80px)); } }
  @keyframes waddle { 0% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes twinkle { 0%, 100% { opacity: .9; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .sprite, .sprite svg { animation: none !important; } .a-pop { display: none; } }

  /* ---------- Layout ---------- */
  .app { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 16px 16px 72px; }
  header.hero {
    position: relative; overflow: hidden; border-radius: 22px; color: #fff;
    background: var(--hero-bg);
    border: 1px solid rgba(255, 255, 255, .16);
    box-shadow: 0 0 0 1px rgba(var(--glow), .25), 0 0 40px rgba(var(--glow), .35), 0 14px 40px rgba(8, 5, 35, .45);
    padding: 28px 28px 22px;
  }
  header.hero::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  .hero-sprites { position: absolute; inset: 0; pointer-events: none; opacity: .35; }
  @media (max-width: 640px) { .hero-sprites { opacity: .2; } .bg .sprite { opacity: .4; } }
  .hero-inner { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; }
  .edition { font-family: Poppins, sans-serif; font-weight: 700; font-size: clamp(18px, 2.4vw, 26px); text-shadow: 0 0 8px rgba(255, 255, 255, .6), 0 0 18px var(--neon); }
  .edition sup { font-size: .6em; }
  h1 {
    font-family: Anton, Impact, sans-serif; font-weight: 400;
    font-size: clamp(46px, 8.5vw, 96px); line-height: .98; margin: 4px 0 14px; letter-spacing: .005em;
    color: #fff;
    text-shadow: 0 0 4px rgba(255, 255, 255, .8), 0 0 14px var(--neon), 0 0 34px rgba(var(--glow), .75), 0 0 70px rgba(var(--glow-2), .7);
  }
  h1 span { display: inline-block; margin-right: .18em; }
  .game-switch { display: flex; gap: 8px; flex-wrap: wrap; }
  .game-pill {
    border: 0; cursor: pointer; transition: background .15s, box-shadow .15s, color .15s;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--pill); color: var(--pill-ink); border-radius: 99px; padding: 7px 18px 7px 8px;
    font-family: Poppins, sans-serif; font-weight: 700; font-size: 15px;
    box-shadow: 0 0 18px rgba(var(--pill-glow), .6);
  }
  .game-pill[aria-pressed="false"] { background: rgba(255, 255, 255, .1); color: #e8e4ff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
  .game-pill[aria-pressed="false"]:hover { background: rgba(255, 255, 255, .2); }
  .game-pill[aria-pressed="false"] svg { opacity: .75; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 14px; padding: 8px 14px; min-width: 96px; backdrop-filter: blur(4px);
  }
  .stat b { display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 26px; line-height: 1.15; text-shadow: 0 0 6px rgba(255, 255, 255, .6), 0 0 16px var(--neon); }
  .stat span { font-size: 12px; color: #e2dcff; font-weight: 500; }
  .progress { position: relative; height: 8px; background: rgba(255, 255, 255, .1); border-radius: 0; overflow: hidden; margin: 20px 0 0; }
  .progress i { display: block; height: 100%; width: 0; transition: width .4s steps(8);
    background: repeating-linear-gradient(90deg, var(--prog-a) 0 8px, var(--prog-b) 8px 16px); box-shadow: 0 0 12px var(--neon); }

  nav.tabs { display: flex; gap: 6px; margin: 20px 0 16px; flex-wrap: wrap; align-items: center; }
  .tab {
    border: 1px solid var(--line); background: var(--surface); padding: 8px 18px; border-radius: 99px;
    cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink-soft);
  }
  .tab:hover { border-color: var(--line-strong); }
  .tab[aria-selected="true"] { background: var(--pill); border-color: var(--pill); color: var(--pill-ink); box-shadow: 0 0 16px rgba(var(--pill-glow), .55); }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--line-strong); background: var(--surface); padding: 8px 14px; border-radius: 8px;
    cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.dark { background: var(--win); color: #fff; border-color: transparent; box-shadow: 0 0 14px rgba(var(--glow), .5); }
  .btn.dark:hover { filter: brightness(1.1); background: var(--win); }
  .icon-btn { padding: 8px 12px; }
  .icon-btn svg { display: block; }
  body.editing .icon-btn { background: var(--win); color: #fff; border-color: transparent; box-shadow: 0 0 14px rgba(var(--glow), .5); }
  .save-state { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .save-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  .save-state.ok::before { background: #5cf2a5; box-shadow: 0 0 8px #5cf2a5; }
  .save-state.busy::before { background: #ffd04a; }
  .save-state.err::before { background: #ff6b8a; }

  .toolbar {
    display: none; gap: 8px; flex-wrap: wrap; align-items: center;
    background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 16px;
  }
  body.editing .toolbar { display: flex; }
  .toolbar .hint { font-size: 13px; color: var(--muted); }
  .notice { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ink-soft); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; display: none; }
  .notice.show { display: block; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Bracket ---------- */
  .bracket-wrap { overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
  .bracket { position: relative; display: flex; gap: 44px; min-width: 1060px; padding: 4px 4px 8px; }
  .bracket svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .bracket svg.lines path { fill: none; stroke: var(--line-strong); stroke-width: 2; }
  .bracket svg.lines path.done { stroke: var(--neon); filter: drop-shadow(0 0 3px var(--neon)); }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 180px; }
  .col-head { text-align: center; margin-bottom: 10px; }
  .col-head b { text-shadow: 0 0 12px rgba(var(--glow), .7); display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 20px; letter-spacing: .03em; }
  .col-head span { font-size: 12px; color: var(--muted); }
  .col-body { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; min-height: 760px; }

  .match { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .match .num { position: absolute; left: -1px; top: -1px; font-size: 10px; font-weight: 700; background: var(--surface-2); color: var(--muted); padding: 1px 6px; border-bottom-right-radius: 6px; border: 1px solid var(--line); display: none; }
  .slot {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; min-height: 40px;
    background: none; border: 0; text-align: left; cursor: default;
  }
  .slot + .slot { border-top: 1px solid var(--line); }
  .slot .seed { font-size: 11px; font-weight: 700; color: var(--muted); width: 18px; text-align: right; flex: none; }
  .slot .who { flex: 1; min-width: 0; }
  .slot .tag { font-weight: 700; display: block; overflow-wrap: anywhere; line-height: 1.25; }
  .slot .sub { font-size: 11px; line-height: 1.3; color: var(--muted); display: block; overflow-wrap: anywhere; }
  .slot .score { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 18px; min-width: 22px; text-align: center; color: var(--muted); }
  .slot.empty .tag { color: var(--line-strong); font-weight: 500; font-style: italic; }
  .slot.win { background: var(--win); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
  .slot.win .sub, .slot.win .seed, .slot.win .score { color: var(--win-sub); }
  .slot.win .tag { text-shadow: 0 0 10px rgba(255, 255, 255, .6); }
  .slot.lose .tag { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .score-in { width: 40px; padding: 2px 4px; text-align: center; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface-2); color: var(--text); font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 15px; }
  .slot.win .score-in { background: rgba(20, 10, 60, .35); color: #fff; border-color: rgba(255, 255, 255, .45); }

  .champ { background: var(--surface); border: 2px solid var(--neon); box-shadow: 0 0 22px rgba(var(--glow), .55), inset 0 0 18px rgba(var(--glow), .2); border-radius: 14px; padding: 18px 14px; text-align: center; }
  .champ .label { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .champ .name { text-shadow: 0 0 6px rgba(255, 255, 255, .7), 0 0 18px var(--neon); font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 26px;  text-transform: uppercase; line-height: 1.1; margin-top: 6px; word-break: break-word; }
  .champ .name.tbd { color: var(--line-strong); }
  .champ .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---------- Torneo (rondas en columnas, como bracket) ---------- */
  .t-rounds { display: flex; gap: 28px; overflow-x: auto; padding: 2px 2px 10px; -webkit-overflow-scrolling: touch; }
  .t-col { flex: 1 0 230px; display: flex; flex-direction: column; min-width: 230px; }
  .t-col.wide { flex-basis: 290px; min-width: 290px; }
  .t-col-body { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
  .mk-group.duel .mk-group-head { padding: 5px 12px; font-size: 11px; }
  .mk-group.duel .mk-group-head b { font-family: Poppins, sans-serif; font-weight: 600; font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .warn { color: #ffd04a; }
  @media (max-width: 720px) {
    .t-rounds { flex-direction: column; overflow: visible; gap: 22px; }
    .t-col, .t-col.wide { min-width: 0; flex-basis: auto; }
    .t-col-body { gap: 10px; }
  }

  /* ---------- Mario Kart ---------- */
  .mk-plan { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .mk-config { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .mk-config label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .mk-config input { width: 110px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface-2); color: var(--text); font-family: Anton, Impact, sans-serif; font-size: 18px; }
  .mk-config .plan { flex: 1; min-width: 240px; font-size: 13px; color: var(--ink-soft); }
  .mk-round { margin-bottom: 26px; }
  .mk-round-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .mk-round-head b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; text-shadow: 0 0 12px rgba(var(--glow), .7); }
  .mk-round-head span { font-size: 13px; color: var(--muted); }
  .mk-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .mk-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .mk-group-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 13px; }
  .mk-group-head b { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }

<!-- Fondo pixel animado estilo Mario Bros (se genera en JS) -->

<div class="road" id="road" aria-hidden="true"></div>

      <div class="stats">

  <nav class="tabs" role="tablist">

  <div class="notice" id="notice"></div>

</div>

<dialog id="pin-dialog">

      // Si en la ronda anterior pasaba 1 por grupo, cada grupo se llena en cuanto terminan los
      // grupos que lo alimentan (como un bracket). Si pasaban varios, se espera a que termine la
      // ronda y se mezclan por lugar para evitar revanchas.
      const prev = rounds[r - 1];
      const groups = d.sizes.map(() => ({ members: [], known: false }));
      if (r === 0) {
        let i = 0; d.sizes.forEach((sz, gi) => { groups[gi].members = t.order.slice(i, i + sz); groups[gi].known = true; i += sz; });
      } else if (prev.k === 1) {
        let i = 0;
        d.sizes.forEach((sz, gi) => {

          groups[gi].known = feeders.every(f => f.done);
          groups[gi].members = groups[gi].known ? feeders.map(f => f.qualifiers[0]) : [];
        });
      } else if (prev.done) {
        const entrants = [];
        for (let q = 0; q < prev.k; q++) prev.groups.forEach(x => entrants.push(x.qualifiers[q]));
        entrants.forEach((pid, i) => groups[i % d.G].members.push(pid));

      const tb = pid => num(t.tb[`${r}:${pid}`]) ?? 0;

  const stores = {

  async function pullRemote(initial = false, g = game) {
    const st = stores[g];

  const PENCIL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

  }));

  // ---------- Render ----------
  const TROPHY = fill => `<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v3h3v2a5 5 0 0 1-5 5h-.3A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 9.3 13H9a5 5 0 0 1-5-5V6h3V3zm10 5v3a3 3 0 0 0 1-2.2V8h-1zM6 8v.8A3 3 0 0 0 7 11V8H6z" fill="${fill}"/></svg>`;
  function champHTML(cp) {
    return `<div class="champ">
        ${TROPHY(cp ? '#ffd84a' : 'var(--line-strong)')}
        <div class="label">Campeón</div>
        <div class="name ${cp ? '' : 'tbd'}">${cp ? esc(shortName(cp)) : '???'}</div>
        ${cp ? `<div class="sub">${cp.tag ? esc(cp.name) : ''}</div>` : '<div class="sub">Por definir</div>'}
      </div>`;
  }
  const player = id => cur().players.find(p => p.id === id);
  const seedNo = id => cur().order.indexOf(id) + 1;

  function rowHTML(R, gr, pid, pos) {
    const t = cur(), p = player(pid), key = `${R.index}:${pid}`;
    const pts = R.sc(pid), inTie = gr.tie.includes(pid), q = gr.qualifiers.includes(pid);
    let cls = 'mk-row';
    if (q) cls += ' q'; else if (inTie) cls += ' tie'; else if (gr.complete) cls += ' out';
    const ptsHTML = editing
      ? `<input class="score-in" type="number" min="0" max="999" inputmode="numeric" value="${esc(t.scores[key] ?? '')}" data-in="pts|${key}" aria-label="Puntos de ${esc(shortName(p))}">`
      : `<span class="pts">${pts === null ? '—' : pts}</span>`;
    const tbVal = t.tb[key];
    const tbHTML = inTie || tbVal !== undefined
      ? (editing
        ? `<span class="tb-line">Desempate <input class="score-in tb-in" type="number" min="0" max="99" inputmode="numeric" value="${esc(tbVal ?? '')}" data-in="tb|${key}" aria-label="Desempate de ${esc(shortName(p))}"></span>`
        : (tbVal !== undefined ? `<span class="tb-line">Desempate: ${esc(tbVal)}</span>` : ''))
      : '';
    const badge = q && gr.size > 2 && !R.final ? '<span class="badge">Pasa</span>' : '';
    return `<div class="${cls}">
      <span class="pos">${gr.size > 2 && gr.complete ? pos + 1 : seedNo(pid)}</span>
      <span class="who"><span class="${tagClass(p)}">${esc(label(p))}</span><span class="sub">${esc(p.name)}</span>${tbHTML}</span>
      ${badge}${ptsHTML}
    </div>`;
  }
  function groupHTML(R, gr) {
    let status = 'Por jugar', scls = '';
    if (!gr.known) { status = 'En espera'; scls = 'wait'; }
    else if (gr.tie.length) { status = 'Empate'; scls = 'tie'; }
    else if (gr.done) { status = 'Terminado'; scls = 'done'; }
    const rows = gr.known
      ? gr.ranked.map((pid, i) => rowHTML(R, gr, pid, i)).join('')
      : Array.from({ length: gr.size }, () => '<div class="mk-row empty"><span class="pos"></span><span class="who"><span class="tag">Por definir</span></span></div>').join('');
    const tieNote = gr.tie.length
      ? `<div class="tie-note">Empate${gr.size > 2 ? ' por el último lugar para pasar' : ''}. Jueguen un desempate y anoten sus puntos en “Desempate”.</div>` : '';
    const title = gr.size === 2 ? `Juego ${gr.no} · 1 vs 1` : `Juego ${gr.no} · ${gr.size} jugadores`;
    return `<div class="mk-group${gr.size === 2 ? ' duel' : ''}">
      <div class="mk-group-head"><b>${title}</b><span class="chip ${scls}">${status}</span></div>
      ${rows}${tieNote}
    </div>`;
  }
  function planText(st) {
    const parts = st.rounds.map((r, i) => {
      const size = r.equal ? r.sizes[0] : r.sizes.join('/');
      return `Ronda ${i + 1}: ${plural(r.G, 'juego', 'juegos')} de ${size}${r.sizes[0] === 2 && r.equal ? ' (1 vs 1)' : ''}, pasa${r.k > 1 ? 'n' : ''} ${r.k}`;
    });
    parts.push('Final 1 vs 1');
    return parts.join(' → ');
  }

  function renderTournament() {
    const t = cur(), c = compute(t, game), n = t.order.length;
    const p = plan(n, game, t.config.consoles, t.config.games);
    let html = '';
    if (editing) {
      const C = t.config.consoles;
      html += `<div class="mk-config">
        <label>Consolas<input type="number" min="1" max="12" value="${C}" data-cfg="consoles"></label>
        <label>Juegos en total<input type="number" min="1" max="${n - 1}" value="${t.config.games}" data-cfg="games"></label>
        <div class="plan">${p.error ? `<b class="warn">${esc(p.error)}</b>` : `<b>${esc(planText(p))}</b><br>
          Total: ${plural(p.games, 'juego', 'juegos')} en ${plural(p.tandas, 'tanda', 'tandas')} con ${plural(C, 'consola', 'consolas')}
          (juegos al mismo tiempo, uno por consola). Con ${plural(C, 'consola', 'consolas')} se puede de ${p.minGames} a ${p.maxGames} juegos.
          ${p.equal ? 'Todos los grupos de cada ronda son del mismo tamaño.' : '<span class="warn">Con estas consolas no se pueden hacer grupos iguales; algunos tienen 1 jugador más.</span>'}
          ${game === 'mk' && p.rounds.some(r => r.sizes.some(s => s > 4)) ? '<br>Los grupos de más de 4 juegan en red local (2 por consola).' : ''}`}
        </div>
      </div>`;
    } else if (c) {
      html += `<p class="mk-plan">${esc(planText(c.plan))} · ${plural(c.plan.games, 'juego', 'juegos')} en total</p>`;
    }
    if (!c) { $('#t-view').innerHTML = html + `<p class="mk-plan warn">${esc(p.error || '')}</p>`; return; }
    html += '<div class="t-rounds">';
    c.rounds.forEach(R => {
      const sub = R.final ? '1 vs 1 · el que haga más puntos gana'
        : `${plural(R.G, 'juego', 'juegos')} · pasa${R.k > 1 ? 'n' : ''} ${R.k}${R.G > 1 || R.sizes[0] > 2 ? (R.sizes[0] === 2 ? '' : ' por grupo') : ''}`;
      html += `<section class="t-col${R.sizes.some(s => s > 2) ? ' wide' : ''}">
        <div class="col-head"><b>${esc(R.name)}</b><span>${esc(sub)}</span></div>
        <div class="t-col-body">${R.groups.map(gr => groupHTML(R, gr)).join('')}</div>
      </section>`;
    });
    html += `<section class="t-col"><div class="col-head"><b>Campeón</b><span>&nbsp;</span></div>
      <div class="t-col-body">${champHTML(c.champion && player(c.champion))}</div></section>`;
    html += '</div>';
    $('#t-view').innerHTML = html;
  }

  function statusOf(pid, c) {
    if (!c) return { cls: '', text: '' };
    if (c.champion === pid) return { cls: 'champion', text: '🏆 Campeón' };
    let text = '', cls = '';
    c.rounds.forEach(R => R.groups.forEach(gr => {
      if (!gr.members.includes(pid)) return;
      const where = R.final ? 'la final' : R.name.toLowerCase();
      if (gr.done && !gr.qualifiers.includes(pid)) { text = R.final ? 'Subcampeón' : `Eliminado en ${where}`; cls = R.final ? '' : 'out'; }
      else if (!gr.done) text = R.final ? 'Finalista' : `En ${where} · juego ${gr.no}`;
    }));
    return { cls, text };
  }
  function renderPlayers() {
    const t = cur(), c = compute(t, game);
    $('#players-grid').innerHTML = t.order.map(player).filter(Boolean).map(p => {
      const st = statusOf(p.id, c);
      const initials = esc((shortName(p) || '?').replace(/[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ]/g, '').slice(0, 2).toUpperCase() || '?');
      return `<div class="pcard ${st.cls}">
        <div class="avatar">${initials}</div>
        <div class="info">
          ${editing
            ? `<input class="tag-in" data-edit="${p.id}" value="${esc(p.tag)}" placeholder="Sin GamerTag" aria-label="GamerTag"><span class="sub">${esc(p.name)}</span>`
            : `<span class="${tagClass(p)}">${esc(label(p))}</span><span class="sub">${esc(p.name)}</span>`}
          <span class="status">#${seedNo(p.id)}${st.text ? ' · ' + esc(st.text) : ''}</span>
        </div>
      </div>`;
    }).join('');
  }
  function renderStats() {
    const t = cur(), c = compute(t, game);
    let total = 0, played = 0, roundText = '—';
    if (c) {
      c.rounds.forEach(R => R.groups.forEach(gr => { total++; if (gr.done) played++; }));
      const next = c.rounds.find(R => !R.done);
      roundText = next ? roundShort(next) : 'Terminado';
    }
    $('#st-players').textContent = t.players.length;
    $('#st-played').textContent = `${played}/${total}`;
    $('#st-round').textContent = roundText;
    $('#progress').style.width = (total ? (played / total) * 100 : 0) + '%';
  }
  function render() {
    const isMk = game === 'mk';
    document.body.classList.toggle('game-mk', isMk); // tema azul y animaciones de Mario Kart
    document.querySelectorAll('.game-pill').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.game === game)));
    $('#toolbar-hint').innerHTML = 'Arriba eliges cuántas <b>consolas</b> y cuántos <b>juegos en total</b>; la estructura se calcula sola. Escribe los puntos de cada jugador: <b>los que hagan más puntos pasan solos a la siguiente ronda</b>, y la final es 1 vs 1.';
    $('#footer-text').textContent = `${isMk ? 'Mario Kart' : 'Smash'} · ${cur().players.length} jugadores · Los resultados se actualizan automáticamente.`;
    renderStats();
    renderTournament();
    renderPlayers();
  }

  // ---------- Interacción ----------
  // Los puntos se juntan y se aplican de una vez: al salir de la casilla (Tab, Enter, tocar
  // fuera) o tras una pausa al escribir. Después se devuelve el cursor a donde esté la persona.
  const pending = new Map();
  let inputTimer;
  function queueInput(el, delay) {
    pending.set(el.dataset.in, el.value);
    clearTimeout(inputTimer);
    inputTimer = setTimeout(flushInputs, delay);
  }
  function flushInputs() {
    clearTimeout(inputTimer);
    if (!pending.size) return;
    const active = document.activeElement;
    const activeKey = active && active.dataset ? active.dataset.in : null;
    const caret = activeKey ? active.value.length : 0;
    const t = cur();
    pending.forEach((val, id) => {
      const [kind, key] = id.split('|');
      if (kind === 'pts') setNum(t.scores, key, val, 999);
      else if (kind === 'tb') setNum(t.tb, key, val, 99);
    });
    pending.clear();
    prune(t, game);
    commit();
    const again = activeKey && document.querySelector(`[data-in="${activeKey}"]`);
    if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch {} }
  }
  document.addEventListener('input', e => {
    if (e.target.dataset && e.target.dataset.in) queueInput(e.target, 900);
  });
  document.addEventListener('change', e => {
    const el = e.target, t = cur();
    if (el.dataset.in) {
      queueInput(el, 0);
    } else if (el.dataset.cfg) {
      const field = el.dataset.cfg;
      let v = parseInt(el.value, 10);
      if (isNaN(v)) { render(); return; }
      v = field === 'consoles' ? Math.max(1, Math.min(12, v)) : Math.max(1, Math.min(t.order.length - 1, v));
      const next = { ...t.config, [field]: v };
      const before = plan(t.order.length, game, t.config.consoles, t.config.games);
      const after = plan(t.order.length, game, next.consoles, next.games);
      if (after.error && after.minGames) next.games = after.minGames; // muy pocos juegos: se ajusta al mínimo
      const fixed = plan(t.order.length, game, next.consoles, next.games);
      if (fixed.error) { alert(fixed.error); render(); return; }
      const same = !before.error && JSON.stringify(before.rounds) === JSON.stringify(fixed.rounds);
      if (!same && hasResults(t) && !confirm('Con esta configuración cambia la estructura del torneo y se borran los puntos que ya se capturaron. ¿Continuar?')) { render(); return; }
      t.config = next;
      if (!same) { t.scores = {}; t.tb = {}; }
      commit();
      if (after.error) alert(`${after.error} Se ajustó a ${next.games}.`);
    } else if (el.dataset.edit) {
      const p = player(el.dataset.edit);
      if (!p) return;
      p.tag = el.value.trim();
      commit();
    }
  });

  // ---------- Arranque ----------
  ['smash', 'mk'].forEach(g => { const l = loadLocal(g); if (validState(l)) S[g] = migrate(g, l); });
  render();
  pullRemote(true, 'smash').then(() => pullRemote(true, 'mk'));
  setInterval(() => { if (document.visibilityState === 'visible') pullRemote(); }, 8000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') pullRemote();
    else flushSave();
  });
  window.addEventListener('pagehide', flushSave);
  // Si hay un cambio pendiente de guardar, lo envía de inmediato (al cerrar o cambiar de pestaña).
  function flushSave() {
    flushInputs();
    if (!remote.configured) return;
    Object.keys(stores).forEach(g => {
      const st = stores[g];
      if (!st.dirty || st.saving) return;
      clearTimeout(st.timer);
      pushRemote(g);
    });
  }
})();
</script>
</body>
</html>
